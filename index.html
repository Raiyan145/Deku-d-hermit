<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahfuz Sharkar</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+Bengali:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --dark: #0a0a0a;
    --dark2: #111;
    --dark3: #1a1a1a;
    --text: #e8e0d0;
    --muted: #888;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Serif Bengali', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== PAGE 1: PROFILE ===== */
  #page-profile {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #1a1200 0%, var(--dark) 70%);
    position: relative;
    padding: 40px 20px;
  }

  #page-profile::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(201,168,76,0.03) 60px, rgba(201,168,76,0.03) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(201,168,76,0.03) 60px, rgba(201,168,76,0.03) 61px);
    pointer-events: none;
  }

  .about-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: 0.8;
  }

  .profile-frame {
    position: relative;
    width: 140px;
    height: 140px;
    margin-bottom: 32px;
  }

  .profile-frame::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) 0deg, var(--gold-light) 90deg, var(--gold) 180deg, #6b5420 270deg, var(--gold) 360deg);
    animation: spin 8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .profile-img {
    position: relative;
    z-index: 1;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    display: block;
    margin: 4px;
    filter: grayscale(100%) contrast(1.1);
    border: 3px solid var(--dark);
  }

  .profile-name {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold-light);
    text-align: center;
    margin-bottom: 6px;
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
  }

  .info-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 2px;
    padding: 24px 40px;
    margin: 20px 0 32px;
    text-align: center;
    position: relative;
  }

  .info-card::before, .info-card::after {
    content: '✦';
    position: absolute;
    color: var(--gold);
    font-size: 10px;
    opacity: 0.5;
  }
  .info-card::before { top: 8px; left: 12px; }
  .info-card::after { bottom: 8px; right: 12px; }

  .info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
    font-size: 14px;
    color: var(--text);
  }

  .info-key {
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    min-width: 60px;
    text-align: right;
  }

  .info-sep {
    color: var(--gold);
    opacity: 0.4;
  }

  .info-val {
    color: #ddd;
    font-size: 15px;
  }

  .btn-secret {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    text-decoration: none;
  }

  .btn-secret::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
  }

  .btn-secret:hover::before {
    transform: translateX(0);
  }

  .btn-secret:hover {
    color: var(--dark);
  }

  .btn-secret span {
    position: relative;
    z-index: 1;
  }

  /* ===== PAGE 2: SECRETS ===== */
  #page-secrets {
    display: none;
    min-height: 100vh;
    background: var(--dark2);
    position: relative;
    overflow-x: hidden;
  }

  .secrets-header {
    padding: 60px 20px 30px;
    text-align: center;
    background: linear-gradient(180deg, #0d0d00 0%, var(--dark2) 100%);
    border-bottom: 1px solid rgba(201,168,76,0.1);
  }

  .secrets-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 8px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .secrets-sub {
    font-size: 22px;
    color: var(--text);
    opacity: 0.7;
  }

  /* Story cards */
  .story-section {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .story-card {
    margin: 50px 0;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .story-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .story-number {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold);
    opacity: 0.5;
    margin-bottom: 16px;
  }

  .story-img-wrap {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.1);
  }

  .story-img-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(10,10,10,0.7) 0%, transparent 50%);
    pointer-events: none;
  }

  .story-img {
    width: 100%;
    height: 360px;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform 0.6s ease;
    filter: sepia(20%) contrast(1.05);
  }

  .story-card:hover .story-img {
    transform: scale(1.04);
  }

  .story-text {
    padding: 24px 0 0;
    position: relative;
  }

  .story-text::before {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 16px;
    opacity: 0.6;
  }

  .story-text p {
    font-size: 17px;
    line-height: 1.9;
    color: #ccc;
    letter-spacing: 0.3px;
  }

  /* Back button */
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 20px 20px;
    padding: 12px 24px;
    background: transparent;
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--muted);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-back:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Page transitions */
  .page-enter {
    animation: fadeUp 0.6s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 30px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(201,168,76,0.25);
    border-top: 1px solid rgba(201,168,76,0.06);
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 16px 0;
    opacity: 0.2;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gold);
  }
  .divider span {
    color: var(--gold);
    font-size: 10px;
  }
</style>
</head>
